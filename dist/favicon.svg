<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200">
  <defs>
    <linearGradient id="gradTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <linearGradient id="gradTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="gradBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <linearGradient id="gradBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#660000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
  </defs>
  
  <!-- Back/Side facets -->
  <polygon points="10,100 50,10 50,100" fill="#b30000" />
  <polygon points="90,100 50,10 50,100" fill="#800000" />
  <polygon points="10,100 50,190 50,100" fill="#4d0000" />
  <polygon points="90,100 50,190 50,100" fill="#330000" />

  <!-- Front facets -->
  <polygon points="50,10 80,100 50,115 20,100" fill="url(#gradTopLeft)" />
  <polygon points="50,10 80,100 50,115" fill="url(#gradTopRight)" />
  <polygon points="20,100 50,190 50,115" fill="url(#gradBottomLeft)" />
  <polygon points="80,100 50,190 50,115" fill="url(#gradBottomRight)" />
  
  <!-- Specular Highlights -->
  <polygon points="50,10 65,100 50,115" fill="#ffffff" opacity="0.4" />
  <polygon points="35,100 50,190 50,115" fill="#ffffff" opacity="0.1" />
</svg>